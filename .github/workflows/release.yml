# A tag v<version> builds the release from that commit: MinterWallet-<version>-win-x64.exe, the Linux file, its
# AppImage and .deb, and SHA256SUMS.txt, then publishes them as a GitHub release with the notes of
# .github/release-notes.md. APKs use private signing secrets; desktop binaries are not Authenticode signed.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/MinterWallet -c Release -r win-x64 -p:PublishSingleFile=true -o out
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          ./out/MinterWallet.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'self-test failed' }
      - name: Name
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/MinterWallet.exe "dist/MinterWallet-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish and package
        run: |
          sudo apt-get install -y desktop-file-utils
          dotnet publish src/MinterWallet -c Release -r linux-x64 -p:PublishSingleFile=true -o out
          ./out/MinterWallet --self-test
          bash tools/package-linux.sh out/MinterWallet "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          MINTERWALLET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MINTERWALLET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          MINTERWALLET_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_RELEASE_SIGNING_LINEAGE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "Configure private Android release signing secrets before publishing."; exit 1; }
          test -n "$ANDROID_RELEASE_SIGNING_LINEAGE_BASE64" || { echo "Configure Android signing lineage for existing installations."; exit 1; }
          export MINTERWALLET_ANDROID_KEYSTORE="$RUNNER_TEMP/minterwallet-release.keystore"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$MINTERWALLET_ANDROID_KEYSTORE"
          dotnet workload install android
          dotnet build src/MinterWallet.Android/MinterWallet.Android.csproj -t:InstallAndroidDependencies -c Release -p:AcceptAndroidSDKLicenses=true -nologo
          dotnet build src/MinterWallet.Android/MinterWallet.Android.csproj -c Release -nologo
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          printf '%s' "$ANDROID_RELEASE_SIGNING_LINEAGE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.lineage"
          signer="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          java -jar "$signer" sign --ks "$MINTERWALLET_ANDROID_KEYSTORE" --ks-key-alias "$MINTERWALLET_ANDROID_KEY_ALIAS" \
            --ks-pass env:MINTERWALLET_ANDROID_STORE_PASSWORD --key-pass env:MINTERWALLET_ANDROID_KEY_PASSWORD \
            --lineage "$RUNNER_TEMP/release.lineage" --rotation-min-sdk-version 28 --min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false \
            --out "dist/MinterWallet-${version}-android-arm64.apk" "$(find src/MinterWallet.Android/bin/Release -name '*-Signed.apk' | head -n 1)"
          java -jar "$signer" verify --min-sdk-version 28 "dist/MinterWallet-${version}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist
  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist && sha256sum MinterWallet-* minter-wallet_* > SHA256SUMS.txt && cd ..
          { if [ -f ".github/notes/$version.md" ]; then cat ".github/notes/$version.md"; fi; sed "s/{version}/$version/g" .github/release-notes.md; } > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Minter Wallet $version" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "Minter Wallet $version" --notes-file notes.md dist/*
          fi
